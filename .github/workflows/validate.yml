name: Validate metadata

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated sample data is up to date
        run: |
          python3 scripts/build-sample-tree.py
          python3 scripts/build-showcase-data.py
          git diff --exit-code -- sample-data/tree sample-data/showcase || {
            echo "Generated sample data is stale: run scripts/build-sample-tree.py and scripts/build-showcase-data.py and commit the result."
            exit 1
          }

      - name: Check XML well-formedness
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.dom.minidom
          failures = []
          files = glob.glob('force-app/**/*.xml', recursive=True) + glob.glob('manifest/*.xml')
          for path in sorted(files):
              try:
                  xml.dom.minidom.parse(path)
                  print(f'OK   {path}')
              except Exception as exc:
                  failures.append((path, exc))
                  print(f'FAIL {path}: {exc}')
          sys.exit(1 if failures else 0)
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Convert source (validates SFDX project structure)
        run: sf project convert source --output-dir mdapi-out

      - name: Verify manifest members exist in source (all manifests)
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          NS = {'m': 'http://soap.sforce.com/2006/04/metadata'}
          SUFFIX = {
              'ReportType': ('force-app/main/default/reportTypes', '.reportType-meta.xml'),
              'Report': ('force-app/main/default/reports', '.report-meta.xml'),
              'Dashboard': ('force-app/main/default/dashboards', '.dashboard-meta.xml'),
          }
          FOLDER_SUFFIX = {
              'Report': '.reportFolder-meta.xml',
              'Dashboard': '.dashboardFolder-meta.xml',
          }

          def candidates_for(kind, value):
              if kind == 'ListView':
                  obj, _, name = value.partition('.')
                  return [Path('force-app/main/default/objects') / obj / 'listViews' / f'{name}.listView-meta.xml']
              if kind not in SUFFIX:
                  return None
              base, suffix = SUFFIX[kind]
              paths = [Path(base) / (value + suffix)]
              if '/' not in value and kind in FOLDER_SUFFIX:
                  paths.append(Path(base) / (value + FOLDER_SUFFIX[kind]))
              return paths

          missing = []
          for manifest in sorted(glob.glob('manifest/*.xml')):
              tree = ET.parse(manifest)
              for t in tree.getroot().findall('m:types', NS):
                  kind = t.find('m:name', NS).text
                  for member in t.findall('m:members', NS):
                      paths = candidates_for(kind, member.text)
                      if paths is None:
                          continue
                      if not any(p.is_file() for p in paths):
                          missing.append(f'{manifest}: {kind} {member.text}')
              print(f'checked {manifest}')
          if missing:
              print('Manifest members with no matching source file:')
              print('\n'.join(missing))
              sys.exit(1)
          print('All manifest members have matching source files.')
          EOF

  # Everything above checks that the metadata is well formed. This job checks that it works:
  # it deploys to a fresh Net Zero Cloud scratch org, loads sample-data/, and runs every
  # report and dashboard against the rows that data was built to produce. It needs a Dev Hub;
  # store its auth URL (sf org display --verbose --target-org <devhub>) as the repository
  # secret DEVHUB_SFDX_AUTH_URL. Without the secret the job does nothing and passes.
  org-check:
    needs: validate
    runs-on: ubuntu-latest
    env:
      DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
    steps:
      - name: Check for a Dev Hub
        id: devhub
        run: |
          if [ -n "$DEVHUB_SFDX_AUTH_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No DEVHUB_SFDX_AUTH_URL secret, so the scratch org check was skipped."
          fi

      - if: steps.devhub.outputs.present == 'true'
        uses: actions/checkout@v4

      - if: steps.devhub.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to a Net Zero Cloud scratch org and check every report
        if: steps.devhub.outputs.present == 'true'
        run: |
          npm install --global @salesforce/cli
          echo "$DEVHUB_SFDX_AUTH_URL" | sf org login sfdx-url --sfdx-url-stdin --alias devhub --set-default-dev-hub
          sf org create scratch --definition-file config/project-scratch-def.json --alias ci --duration-days 1 --wait 20
          sf org assign permset --name NetZeroAdmin --name NetZeroManager --target-org ci
          sf project deploy start --manifest manifest/package.xml --target-org ci --wait 30
          sf project deploy start --manifest manifest/package-4-list-views.xml --target-org ci --wait 30
          sf project deploy start --metadata-dir sample-data/org-setup --target-org ci --wait 10
          sf data import tree --plan sample-data/tree/plan.json --target-org ci
          python3 scripts/check-reports.py --target-org ci

      - name: Delete the scratch org
        if: always() && steps.devhub.outputs.present == 'true'
        run: sf org delete scratch --target-org ci --no-prompt || true
